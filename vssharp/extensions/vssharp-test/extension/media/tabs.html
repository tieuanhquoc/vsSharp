<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      align-items: center;
      height: 100%;
      padding: 0 8px;
      background: transparent;
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
    }
    .tab {
      border: none;
      background: transparent;
      color: var(--vscode-foreground);
      padding: 3px 10px;
      border-radius: 5px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      opacity: 0.65;
      transition: background 120ms, opacity 120ms;
    }
    .tab:hover { opacity: 1; background: var(--vscode-toolbar-hoverBackground, rgba(255,255,255,0.07)); }
    .tab.active {
      opacity: 1;
      background: var(--vscode-toolbar-activeBackground, rgba(255,255,255,0.14));
    }
  </style>
</head>
<body>
  <button class="tab active" data-tab="solution">Solution</button>
  <button class="tab"        data-tab="files">Files</button>
  <script nonce="{{nonce}}">
    const vscode = acquireVsCodeApi();
    const tabs   = document.querySelectorAll('.tab');

    tabs.forEach(t => t.addEventListener('click', () => {
      tabs.forEach(x => x.classList.toggle('active', x === t));
      vscode.postMessage({ type: 'switchTab', tab: t.dataset.tab });
    }));

    window.addEventListener('message', e => {
      const { type, tab } = e.data || {};
      if (type === 'setTab') {
        tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      }
    });
  </script>
</body>
</html>
