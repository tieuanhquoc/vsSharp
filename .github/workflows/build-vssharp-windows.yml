name: Build VS Sharp - Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  APP_NAME: VS Sharp
  BINARY_NAME: vssharp
  ORG_NAME: VSSharp
  ASSETS_REPOSITORY: VSSharp/vs-sharp
  GH_REPO_PATH: VSSharp/vs-sharp
  OS_NAME: windows
  VSCODE_ARCH: x64
  VSCODE_QUALITY: stable
  CI_BUILD: no
  SHOULD_BUILD: yes
  SHOULD_BUILD_REH: no
  SHOULD_BUILD_REH_WEB: no
  VSCODE_SKIP_NODE_VERSION_CHECK: yes
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug environment
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          Write-Host "=== Current user ==="
          whoami
          Write-Host "=== USERPROFILE ==="
          Write-Host $env:USERPROFILE
          Write-Host "=== where python ==="
          where.exe python 2>&1
          Write-Host "=== System PATH ==="
          [Environment]::GetEnvironmentVariable("Path","Machine")

      - name: Add tools to PATH
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          # Git Bash
          $gitBin = Join-Path (Split-Path (Split-Path (Get-Command git).Source)) "bin"
          if (Test-Path $gitBin) { echo $gitBin >> $env:GITHUB_PATH }

          # NSIS
          if (Test-Path "C:\Program Files (x86)\NSIS") {
            echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          }

          # WiX Toolset v3
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -ErrorAction SilentlyContinue |
                 Sort-Object Name -Descending | Select-Object -First 1
          if ($wix) { echo "$($wix.FullName)\bin" >> $env:GITHUB_PATH }

          # Chocolatey
          if (Test-Path "C:\ProgramData\chocolatey\bin") {
            echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
          }

          # Python — search registry (works regardless of which user runs the runner)
          foreach ($hive in @("HKLM:\SOFTWARE\Python\PythonCore","HKCU:\SOFTWARE\Python\PythonCore")) {
            Get-ChildItem $hive -ErrorAction SilentlyContinue | ForEach-Object {
              $ip = (Get-ItemProperty "$($_.PSPath)\InstallPath" -ErrorAction SilentlyContinue).'(default)'
              if ($ip) {
                $ip = $ip.TrimEnd('\')
                if (Test-Path $ip) { echo $ip >> $env:GITHUB_PATH }
                if (Test-Path "$ip\Scripts") { echo "$ip\Scripts" >> $env:GITHUB_PATH }
              }
            }
          }

      - name: Verify build tools
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $missing = @()
          foreach ($cmd in @("node","python","dotnet","jq","makensis","candle")) {
            if (-not (Get-Command $cmd -ErrorAction SilentlyContinue)) { $missing += $cmd }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing tools: $($missing -join ', '). Run vssharp\setup-windows-runner.ps1 as Administrator on this machine first."
            exit 1
          }
          Write-Host "node:     $(node --version)"
          Write-Host "python:   $((python --version 2>&1))"
          Write-Host "dotnet:   $(dotnet --version)"
          Write-Host "jq:       $(jq --version)"

      # ── vscode source (reuse if already prepared on this runner) ──────────
      - name: Prepare vscode source
        run: |
          if [[ ! -d "vscode/.build" ]]; then
            echo "vscode/ not ready — running full prepare pipeline ..."
            . ./get_repo.sh
            . ./prepare_vscode.sh
          else
            echo "vscode/ already prepared — skipping."
            cd vscode
            git add -A
            while git log -1 | grep -q "VSCODIUM HELPER"; do
              git reset -q --hard HEAD~
            done
            cd ..
            . ./prepare_vscode.sh
          fi

      - name: Generate dev/build.env
        run: |
          MS_COMMIT=$( node -p "require('./upstream/stable.json').commit" )
          MS_TAG=$( node -p "require('./upstream/stable.json').tag" )
          RELEASE_VERSION="${MS_TAG}"
          BUILD_SOURCEVERSION=$( printf '%s' "${RELEASE_VERSION}" | sha1sum | cut -d' ' -f1 )
          {
            echo "MS_TAG=\"${MS_TAG}\""
            echo "MS_COMMIT=\"${MS_COMMIT}\""
            echo "RELEASE_VERSION=\"${RELEASE_VERSION}\""
            echo "BUILD_SOURCEVERSION=\"${BUILD_SOURCEVERSION}\""
          } > dev/build.env
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          cat dev/build.env

      - name: Apply version + branding
        run: |
          ./apply-version.sh
          ./apply-branding.sh

      # ── VS Sharp extensions ───────────────────────────────────────────────
      - name: Build vssharp-runner
        run: |
          cd vssharp/extensions/vssharp-runner
          npm install --prefer-offline
          npm run compile

      - name: Build vssharp-explorer
        run: |
          cd vssharp/extensions/vssharp-explorer
          npm install --prefer-offline
          npm run compile

      - name: Bundle extensions into vscode/
        run: ./vssharp/extend-prepare.sh

      # ── DotRush (skip if already built) ──────────────────────────────────
      - name: Build DotRush
        run: |
          if [[ ! -d "vssharp/extensions/dotrush/extension/bin" ]]; then
            ./vssharp/install-dotrush.sh
          else
            echo "DotRush already built — skipping."
          fi

      # ── Package ───────────────────────────────────────────────────────────
      - name: Build Windows installer
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: ./dev/build.sh -s -p

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: vssharp-windows-${{ env.RELEASE_VERSION }}
          path: assets/
          retention-days: 14

      # ── Cleanup (runs even if build fails) ────────────────────────────────
      - name: Cleanup temp artifacts
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          foreach ($dir in @("VSCode-win32-x64","vscode-cli","assets","vscode\.build","vscode\out","vscode\out-build","vscode\out-vscode-min")) {
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          }
